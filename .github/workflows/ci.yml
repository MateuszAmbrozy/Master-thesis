name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[visualization]"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/smoke.py --output results/ci_smoke
      - run: python scripts/check_docs.py
      - run: python scripts/verify_research.py
      - run: python scripts/verify_provenance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-python-${{ matrix.python }}
          path: results/ci_smoke
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[native]'
      - run: python scripts/build_solvers.py
      - run: python -m unittest discover -s tests -v
        env:
          PRIMAL_REQUIRE_NATIVE: '1'
      - run: python scripts/evaluate.py --config configs/experiments/solvers_smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-results
          path: results/solvers_smoke
